<!DOCTYPE html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datenkatalog – Bundesamt für Bauten und Logistik</title>
  <meta name="description" content="Datenkatalog des BBL: Geschäftsobjekte, Datentabellen, Referenzdaten, Datenprodukte und APIs. Prototyp mit fiktiven Inhalten.">
  <link rel="icon" type="image/svg+xml" href="assets/swiss-logo-flag.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="vendor/swagger-ui/swagger-ui.css">
  <link rel="stylesheet" href="css/main.css">

<body>
  <a class="ob-skip-link" href="#main" data-action="skip">Zum Inhalt springen</a>

  <header class="ob-header" id="header">

        <span class="ob-header-app" id="brand-app"></span>

    </div>
    <nav class="ob-main-nav" id="main-nav" aria-label="Hauptnavigation"></nav>

  <main class="ob-main" id="main" tabindex="-1">

  <footer class="ob-footer" id="footer"></footer>
  <div class="ob-toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script src="vendor/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="js/ui.js"></script>
