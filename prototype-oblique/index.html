<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datenkatalog – Bundesamt für Bauten und Logistik</title>
  <meta name="description" content="Datenkatalog des BBL: Geschäftsobjekte, Datentabellen, Referenzdaten, Datenprodukte und APIs. Prototyp mit fiktiven Inhalten.">
  <link rel="icon" type="image/svg+xml" href="assets/swiss-logo-flag.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css" id="main-css">
  <link rel="stylesheet" href="css/graph.css">
</head>
<body>
  <a class="ob-skip-link" href="#main" id="skip-link" data-action="skip">Zum Inhalt springen</a>

  <header class="ob-header" id="header">
    <div class="ob-header-bar">
      <a class="ob-logo" href="#/" id="brand-link">
        <img class="ob-logo-flag" src="assets/swiss-logo-flag.svg" alt="" width="30" height="33">
        <span class="ob-logo-title-container">
          <span class="ob-logo-acronym" id="brand-acronym" aria-hidden="true"></span>
          <span class="ob-logo-title" id="brand-org"></span>
          <span class="ob-logo-subtitle" id="brand-app"></span>
        </span>
      </a>
      <div class="ob-header-tools" id="header-tools"></div>
    </div>
    <div class="ob-navigation-bar"><nav class="ob-main-nav" id="main-nav" aria-label="Hauptnavigation"></nav></div>
  </header>

  <main class="ob-main" id="main" tabindex="-1">
    <div class="ob-loading" id="loading">Daten werden geladen…</div>
  </main>

  <footer class="ob-footer" id="footer"></footer>
  <button type="button" class="ob-button ob-back-to-top" id="back-to-top" data-action="back-to-top" aria-controls="main" hidden></button>
  <div class="ob-toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/views.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
